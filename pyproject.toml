[project]
name = "casework-agent"
version = "0.1.0"
description = "Auditable fictional delivery exception agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.2",
    "httpx==0.28.1",
    "huggingface-hub==2.2.0",
    "psutil==7.2.2",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "uvicorn==0.54.0",
]
[project.scripts]
casework-agent = "casework_agent.cli:main"

[project.optional-dependencies]
model = [
    "mlx-lm==0.32.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "outlines==1.3.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/casework_agent", "mocks", "eval"]
[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "mocks", "eval", "scripts", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--basetemp=.runtime/pytest"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
    "types-psutil==7.2.2.20260906",
]
