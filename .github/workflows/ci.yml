name: Fixture verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/pw-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: npm --prefix web ci
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test -- --run
      - run: npm --prefix web run build
      - run: web/node_modules/.bin/playwright install --with-deps chromium
      - run: npm --prefix web run e2e
      - run: uv run python scripts/export_contracts.py && npm --prefix web run contracts
      - run: git diff --exit-code -- contracts/openapi.json web/src/api/generated.ts web/src/api/case.schema.json
